<!-- Custom Admin Sidebar (Desktop Docked & Mobile Slide-Over Drawer) -->
{% load static %}
<div>
    <!-- Mobile Sidebar Backdrop (Only visible on mobile when sidebar is open) -->
    <div x-show="adminMobileSidebar" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-40 bg-gray-900/80 backdrop-blur-sm md:hidden"
         @click="adminMobileSidebar = false" 
         x-cloak>
    </div>

    <!-- Sidebar Container -->
    <aside class="bg-gray-900 text-gray-300 flex flex-col justify-between shrink-0 border-r border-gray-800 transition-transform duration-300 z-50
                  fixed top-0 bottom-0 left-0 w-64 h-full
                  md:sticky md:top-0 md:h-screen md:translate-x-0"
           :class="adminMobileSidebar ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        
        <div>
            <!-- Admin Brand Header -->
            <div class="h-20 px-6 flex items-center justify-between border-b border-gray-800">
                
                <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-2 group shrink-0">
                    <img src="{% static 'images/home/comcare_logo.png' %}" class="h-16 md:h-18 w-auto object-contain" alt="ComCare">
                </a>

                <!-- Close Button (Mobile Only) -->
                <button @click="adminMobileSidebar = false" class="md:hidden p-1.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Group -->
            <div class="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-140px)] text-xs">
                <div class="px-3 py-1.5 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Main Control</div>
                
                <!-- Dashboard Overview -->
                <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_dashboard' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_dashboard' %}text-white{% else %}text-red-400{% endif %}"></i> Dashboard Overview
                </a>

                <!-- Orders & Shipments -->
                <a href="{% url 'admin_orders' %}" class="flex items-center justify-between px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_orders' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <div class="flex items-center gap-3">
                        <i data-lucide="shopping-bag" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_orders' %}text-white{% else %}text-emerald-400{% endif %}"></i> Orders & Shipments
                    </div>
                </a>

                <!-- Products Catalog -->
                <a href="{% url 'admin_products' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_products' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <i data-lucide="package" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_products' %}text-white{% else %}text-indigo-400{% endif %}"></i> Products Catalog
                </a>

                <!-- Categories & Brands -->
                <a href="{% url 'admin_categories' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_categories' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <i data-lucide="layers" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_categories' %}text-white{% else %}text-purple-400{% endif %}"></i> Categories & Brands
                </a>

                <!-- Inventory Control -->
                <a href="{% url 'admin_inventory' %}" class="flex items-center justify-between px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_inventory' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <div class="flex items-center gap-3">
                        <i data-lucide="boxes" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_inventory' %}text-white{% else %}text-amber-400{% endif %}"></i> Inventory Control
                    </div>
                </a>

                <div class="px-3 pt-4 pb-1.5 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Operations</div>

                <!-- Service Leads -->
                <a href="{% url 'admin_services' %}" class="flex items-center justify-between px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_services' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <div class="flex items-center gap-3">
                        <i data-lucide="wrench" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_services' %}text-white{% else %}text-cyan-400{% endif %}"></i> Service Leads
                    </div>
                </a>

                <!-- Returns & Exchanges -->
                <a href="{% url 'admin_returns' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_returns' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_returns' %}text-white{% else %}text-rose-400{% endif %}"></i> Returns & Exchanges
                </a>

                <!-- Customer CRM -->
                <a href="{% url 'admin_customers' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_customers' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <i data-lucide="users" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_customers' %}text-white{% else %}text-sky-400{% endif %}"></i> Customer CRM
                </a>

                <!-- Coupons & Offers -->
                <a href="{% url 'admin_coupons' %}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold transition {% if request.resolver_match.url_name == 'admin_coupons' %}bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}text-gray-300 hover:bg-[var(--color-primary)]/20 hover:text-white{% endif %}">
                    <i data-lucide="ticket" class="w-4 h-4 {% if request.resolver_match.url_name == 'admin_coupons' %}text-white{% else %}text-emerald-400{% endif %}"></i> Coupons & Offers
                </a>
            </div>
        </div>

        <!-- Sidebar Bottom Action -->
        <div class="p-4 border-t border-gray-800">
            <a href="{% url 'home' %}" target="_blank" class="flex items-center justify-between p-3 rounded-xl bg-gray-800/80 hover:bg-[var(--color-primary)] text-xs font-semibold text-white transition">
                <span class="flex items-center gap-2">
                    <i data-lucide="globe" class="w-4 h-4 text-red-400"></i> View Live Store
                </span>
                <i data-lucide="external-link" class="w-3.5 h-3.5 text-gray-400"></i>
            </a>
        </div>
    </aside>
</div>
