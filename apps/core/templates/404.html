{% extends 'base.html' %}

{% block title %}404 — Page Not Found | ComCare{% endblock %}

{% block content %}
<div class="py-20 bg-[var(--color-background)] flex items-center justify-center min-h-[calc(100vh-250px)]">
    <div class="max-w-md mx-auto px-4 text-center space-y-6">
        <div class="w-20 h-20 rounded-3xl bg-red-100 text-[var(--color-primary)] flex items-center justify-center mx-auto shadow-md">
            <i data-lucide="file-question" class="w-10 h-10"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-4xl font-extrabold text-gray-900 font-outfit">404 — Page Not Found</h1>
            <p class="text-xs text-gray-500">The page you are looking for might have been moved or doesn't exist.</p>
        </div>
        <div class="pt-2 flex justify-center gap-3">
            <a href="{% url 'home' %}" class="bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white px-6 py-3 rounded-xl font-bold text-xs shadow-md transition">
                Return to Homepage
            </a>
            <a href="{% url 'shop' %}" class="bg-white border border-gray-300 text-gray-800 px-6 py-3 rounded-xl font-bold text-xs transition">
                Browse Shop
            </a>
        </div>
    </div>
</div>
{% endblock %}
