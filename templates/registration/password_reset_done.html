{% extends 'base.html' %}

{% block title %}Password Reset Sent — ComCare{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-3xl border border-gray-200 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 bg-red-50 text-[var(--color-primary)] rounded-2xl flex items-center justify-center mx-auto">
            <i data-lucide="mail-check" class="w-8 h-8"></i>
        </div>

        <div class="space-y-2">
            <h2 class="text-2xl font-extrabold text-gray-900 font-outfit">Check Your Email</h2>
            <p class="text-xs text-gray-500 leading-relaxed">
                We have sent instructions for resetting your password to your registered email address. Please check your inbox (and spam folder).
            </p>
        </div>

        <div class="pt-4 border-t border-gray-100">
            <a href="{% url 'login' %}" class="inline-flex items-center gap-2 text-xs font-bold text-[var(--color-primary)] hover:underline">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
