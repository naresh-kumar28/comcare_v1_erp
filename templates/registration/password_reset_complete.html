{% extends 'base.html' %}

{% block title %}Password Reset Complete — ComCare{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-3xl border border-gray-200 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto">
            <i data-lucide="check-circle" class="w-8 h-8"></i>
        </div>

        <div class="space-y-2">
            <h2 class="text-2xl font-extrabold text-gray-900 font-outfit">Password Reset Complete</h2>
            <p class="text-xs text-gray-500">
                Your password has been set successfully. You may now log in with your new password.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'login' %}" class="inline-block w-full py-3.5 bg-[var(--color-primary)] text-white text-xs font-bold rounded-xl hover:bg-[var(--color-primary-hover)] transition shadow-lg shadow-blue-500/20">
                Log In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
