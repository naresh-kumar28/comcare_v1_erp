<nav id="desktop-sidebar-nav" hx-swap-oob="outerHTML" class="space-y-1.5" hx-target="#account-main-content" hx-indicator="#account-main-content" hx-swap="innerHTML" hx-push-url="true">
    <a href="{% url 'dashboard' %}" hx-get="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'dashboard' or request.resolver_match.url_name == 'dashboard' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
    </a>
    <a href="{% url 'account_orders' %}" hx-get="{% url 'account_orders' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'orders' or request.resolver_match.url_name == 'account_orders' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="history" class="w-4 h-4"></i> Order History
    </a>
    <a href="{% url 'wishlist' %}" hx-get="{% url 'wishlist' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'wishlist' or request.resolver_match.url_name == 'wishlist' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="heart" class="w-4 h-4"></i> Wishlist
    </a>
    <a href="{% url 'profile' %}" hx-get="{% url 'profile' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'profile' or request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'update_profile' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="user" class="w-4 h-4"></i> Profile
    </a>
    <a href="{% url 'addresses' %}" hx-get="{% url 'addresses' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'addresses' or request.resolver_match.url_name == 'addresses' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="map-pin" class="w-4 h-4"></i> Addresses
    </a>
    <a href="{% url 'change_password' %}" hx-get="{% url 'change_password' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'change_password' or request.resolver_match.url_name == 'change_password' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="lock" class="w-4 h-4"></i> Change Password
    </a>
    <a href="{% url 'forgot_password' %}" hx-get="{% url 'forgot_password' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {% if active_tab == 'forgot_password' or request.resolver_match.url_name == 'forgot_password' %}font-bold bg-[var(--color-primary)] text-white shadow-md shadow-blue-500/10{% else %}font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50{% endif %} transition">
        <i data-lucide="key-round" class="w-4 h-4"></i> Reset Password
    </a>
    {% if request.user.is_staff or request.user.is_superuser %}
    <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition">
        <i data-lucide="shield-check" class="w-4 h-4"></i> Admin Panel
    </a>
    {% endif %}
</nav>
