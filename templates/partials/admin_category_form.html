<div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
        <h3 class="font-bold text-gray-900 text-base font-outfit">
            {% if category %}Edit Category: <span class="text-[var(--color-primary)]">{{ category.name }}</span>{% else %}Add New Category{% endif %}
        </h3>
        <button type="button" @click="showCatModal = false" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <form method="POST"
          action="{% url 'admin_category_save' %}"
          hx-post="{% url 'admin_category_save' %}"
          {% if category %}
              hx-target="#category-card-{{ category.id }}"
              hx-swap="outerHTML"
          {% else %}
              hx-target="#categories-grid"
              hx-swap="afterbegin"
          {% endif %}
          enctype="multipart/form-data"
          @submit="showCatModal = false"
          class="space-y-3 text-xs">
        {% csrf_token %}

        {% if category %}
            <input type="hidden" name="category_id" value="{{ category.id }}">
        {% endif %}

        <div>
            <label class="block font-bold text-gray-700 mb-1">Category Name *</label>
            <input type="text" name="name" required value="{{ category.name|default:'' }}" placeholder="e.g. CCTV Security" class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl focus:outline-none focus:border-[var(--color-primary)] font-medium">
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="2" placeholder="Brief category summary..." class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl focus:outline-none focus:border-[var(--color-primary)]">{{ category.description|default:'' }}</textarea>
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-1">Category Image</label>
            <div class="flex items-center gap-3">
                {% if category and category.image %}
                    <img src="{{ category.image.url }}" alt="{{ category.name }}" class="w-10 h-10 rounded-xl object-cover border border-gray-200">
                {% endif %}
                <input type="file" name="image" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-red-50 file:text-[var(--color-primary)] hover:file:bg-red-100 cursor-pointer">
            </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
            <label class="flex items-center gap-2 font-bold text-gray-700 cursor-pointer">
                <input type="checkbox" name="is_active" {% if not category or category.is_active %}checked{% endif %} class="rounded text-[var(--color-primary)]"> Active Category
            </label>
        </div>

        <button type="submit" class="w-full bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-1.5">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Save Category
        </button>
    </form>
</div>
