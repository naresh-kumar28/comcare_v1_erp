<div id="mobile-subnav" hx-swap-oob="outerHTML" class="lg:hidden flex overflow-x-auto gap-2 pb-2 scrollbar-none border-b border-gray-200 bg-white px-4 py-3 sticky top-0 z-20" hx-target="#account-main-content" hx-indicator="#account-main-content" hx-swap="innerHTML" hx-push-url="true">
    <a href="{% url 'dashboard' %}" hx-get="{% url 'dashboard' %}" class="px-4 py-2 {% if active_tab == 'dashboard' or request.resolver_match.url_name == 'dashboard' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Dashboard</a>
    <a href="{% url 'account_orders' %}" hx-get="{% url 'account_orders' %}" class="px-4 py-2 {% if active_tab == 'orders' or request.resolver_match.url_name == 'account_orders' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Order History</a>
    <a href="{% url 'wishlist' %}" hx-get="{% url 'wishlist' %}" class="px-4 py-2 {% if active_tab == 'wishlist' or request.resolver_match.url_name == 'wishlist' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Wishlist</a>
    <a href="{% url 'profile' %}" hx-get="{% url 'profile' %}" class="px-4 py-2 {% if active_tab == 'profile' or request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'update_profile' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Profile</a>
    <a href="{% url 'addresses' %}" hx-get="{% url 'addresses' %}" class="px-4 py-2 {% if active_tab == 'addresses' or request.resolver_match.url_name == 'addresses' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Addresses</a>
    <a href="{% url 'change_password' %}" hx-get="{% url 'change_password' %}" class="px-4 py-2 {% if active_tab == 'change_password' or request.resolver_match.url_name == 'change_password' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Change Password</a>
    <a href="{% url 'forgot_password' %}" hx-get="{% url 'forgot_password' %}" class="px-4 py-2 {% if active_tab == 'forgot_password' or request.resolver_match.url_name == 'forgot_password' %}bg-[var(--color-primary)] text-white shadow-sm{% else %}bg-gray-50 text-gray-600 hover:text-gray-900 transition{% endif %} text-xs font-bold rounded-lg whitespace-nowrap">Reset Password</a>
    {% if request.user.is_staff or request.user.is_superuser %}
    <a href="{% url 'admin_dashboard' %}" class="px-4 py-2 bg-gray-50 text-gray-600 hover:text-gray-900 text-xs font-bold rounded-lg whitespace-nowrap transition">Admin Panel</a>
    {% endif %}
</div>
