<a href="{% url 'cart' %}" class="py-3.5 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm text-center transition flex items-center justify-center gap-2 max-sm:py-3 max-sm:text-xs shadow-md shadow-emerald-600/20">
    <i data-lucide="check-circle" class="w-4 h-4"></i> Go to Cart
</a>

<!-- Out of band swap for cart count badge -->
<span id="header-cart-badge" hx-swap-oob="true" class="absolute -top-1.5 -right-2 w-4 h-4 rounded-full bg-[var(--color-primary)] text-white text-[9px] font-bold flex items-center justify-center border-2 border-white">{{ cart_count }}</span>

<!-- Out of band swap for toast popup -->
<div id="toast-container" hx-swap-oob="beforeend">
    <div class="bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 border border-gray-800 text-xs font-semibold select-none pointer-events-auto transition-all duration-300 transform translate-y-0 opacity-100"
         x-data="{ show: true }"
         x-show="show"
         x-init="setTimeout(() => show = false, 1000)"
         x-transition:leave="transition ease-in duration-300"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-90 translate-y-2">
        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
        <span>Item added to cart!</span>
    </div>
</div>
