<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm"
     x-data="{ discountType: '{{ coupon.discount_type|default:'fixed' }}' }">
    <div class="bg-white w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl animate-in fade-in zoom-in duration-200"
         @click.outside="document.getElementById('coupon-modal-container').innerHTML = ''">
        
        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
            <h3 class="font-bold text-gray-900 text-base font-outfit">
                {% if coupon %}Edit Coupon Code ({{ coupon.code }}){% else %}Create New Discount Coupon{% endif %}
            </h3>
            <button @click="document.getElementById('coupon-modal-container').innerHTML = ''" class="text-gray-400 hover:text-gray-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <form hx-post="{% url 'admin_coupon_save' %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#coupon-modal-container"
              hx-swap="innerHTML"
              class="space-y-4 text-xs">
            
            {% if coupon %}
                <input type="hidden" name="coupon_id" value="{{ coupon.id }}">
            {% endif %}

            <!-- Coupon Code & Description -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Coupon Code *</label>
                    <input type="text"
                           name="code"
                           value="{{ coupon.code|default:'' }}"
                           required
                           placeholder="e.g. FESTIVE20"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-bold uppercase focus:outline-none focus:border-[var(--color-primary)]">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Short Description</label>
                    <input type="text"
                           name="description"
                           value="{{ coupon.description|default:'' }}"
                           placeholder="e.g. Welcome offer ₹500 off"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-medium focus:outline-none focus:border-[var(--color-primary)]">
                </div>
            </div>

            <!-- Discount Type & Value -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Discount Type *</label>
                    <select name="discount_type"
                            x-model="discountType"
                            class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-semibold focus:outline-none focus:border-[var(--color-primary)]">
                        <option value="fixed" {% if coupon.discount_type == 'fixed' or not coupon %}selected{% endif %}>Flat Amount (₹)</option>
                        <option value="percentage" {% if coupon.discount_type == 'percentage' %}selected{% endif %}>Percentage (%)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">
                        Discount Value <span x-text="discountType === 'percentage' ? '(%)' : '(₹)'">*</span>
                    </label>
                    <input type="number"
                           step="0.01"
                           name="discount_value"
                           value="{{ coupon.discount_value|default:'' }}"
                           required
                           placeholder="500"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-bold focus:outline-none focus:border-[var(--color-primary)]">
                </div>
            </div>

            <!-- Min Order & Usage Limit -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Min Order Amount (₹)</label>
                    <input type="number"
                           step="0.01"
                           name="min_order_amount"
                           value="{{ coupon.min_order_amount|default:'0' }}"
                           placeholder="2000"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-medium focus:outline-none focus:border-[var(--color-primary)]">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Total Usage Limit</label>
                    <input type="number"
                           name="usage_limit"
                           value="{{ coupon.usage_limit|default:'' }}"
                           placeholder="100 (Leave blank for unlimited)"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-medium focus:outline-none focus:border-[var(--color-primary)]">
                </div>
            </div>

            <!-- Max Discount Cap (Percentage only) & Expiry Date -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div x-show="discountType === 'percentage'">
                    <label class="block font-bold text-gray-700 mb-1">Max Discount Cap (₹)</label>
                    <input type="number"
                           step="0.01"
                           name="max_discount_amount"
                           value="{{ coupon.max_discount_amount|default:'' }}"
                           placeholder="e.g. 1000 (Optional)"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-medium focus:outline-none focus:border-[var(--color-primary)]">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">Expiry Date (Optional)</label>
                    <input type="date"
                           name="valid_to"
                           value="{{ coupon.valid_to|date:'Y-m-d' }}"
                           class="w-full p-3 bg-[var(--color-background)] border border-gray-200 rounded-xl font-medium focus:outline-none focus:border-[var(--color-primary)]">
                </div>
            </div>

            <!-- Active Checkbox -->
            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox"
                       id="coupon_is_active"
                       name="is_active"
                       value="true"
                       {% if coupon.is_active or not coupon %}checked{% endif %}
                       class="w-4 h-4 text-[var(--color-primary)] rounded border-gray-300 focus:ring-red-500">
                <label for="coupon_is_active" class="font-bold text-gray-700 cursor-pointer">Enable & Activate Coupon Immediately</label>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                <button type="button"
                        @click="document.getElementById('coupon-modal-container').innerHTML = ''"
                        class="px-5 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition">
                    Cancel
                </button>
                <button type="submit"
                        class="px-6 py-2.5 bg-[var(--color-primary)] text-white font-bold rounded-xl shadow-md hover:bg-[var(--color-primary-hover)] transition">
                    {% if coupon %}Save Changes{% else %}Create Coupon{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
