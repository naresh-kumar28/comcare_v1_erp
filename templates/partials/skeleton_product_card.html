<!-- Skeleton Shimmer Product Card Component -->
<div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm animate-pulse flex flex-col h-full justify-between">
    <!-- Image Shimmer (aspect ratio 4:3) -->
    <div class="w-full aspect-[4/3] bg-gray-200 rounded-xl relative overflow-hidden shrink-0">
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent animate-shimmer"></div>
    </div>
    <!-- Details wrapper -->
    <div class="flex flex-col flex-grow mt-3">
        <!-- Badges & Category Shimmer -->
        <div class="h-3 bg-gray-200 rounded-md w-1/3 mb-2"></div>
        <!-- Title Shimmer (1 line exactly, height 20px) -->
        <div class="h-5 min-h-[1.25rem] mb-2 flex items-center">
            <div class="h-4 bg-gray-200 rounded-md w-5/6"></div>
        </div>
        <!-- Rating Shimmer -->
        <div class="h-3 bg-gray-200 rounded-md w-1/4 mb-3"></div>
        <!-- Price Shimmer -->
        <div class="h-5 bg-gray-200 rounded-md w-1/2 mb-4"></div>
        <!-- Button Shimmer (mt-auto) -->
        <div class="mt-auto pt-3 border-t border-gray-100">
            <div class="grid grid-cols-2 gap-2">
                <div class="h-9 bg-gray-200 rounded-xl"></div>
                <div class="h-9 bg-gray-200 rounded-xl"></div>
            </div>
        </div>
    </div>
</div>
