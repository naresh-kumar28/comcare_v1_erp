{% if products %}
    <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 border-t border-gray-100 pt-3">Products Found</div>
    <div class="space-y-2">
        {% for product in products %}
        <a href="{% url 'shop' %}?q={{ product.title }}" class="flex items-center gap-3 p-2 hover:bg-gray-50 dark:hover:bg-gray-800/50 rounded-lg transition text-left">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="w-10 h-10 object-cover rounded-lg border border-gray-100 shrink-0">
            {% else %}
            <div class="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center shrink-0">
                <i data-lucide="image" class="w-4 h-4 text-gray-400"></i>
            </div>
            {% endif %}
            <div class="flex-1 min-w-0">
                <div class="text-xs font-bold text-gray-900 dark:text-gray-100 truncate">{{ product.title }}</div>
                <div class="text-[10px] text-gray-500 font-semibold truncate">{{ product.brand }} | SKU: {{ product.sku }}</div>
            </div>
            <div class="text-xs font-bold text-[var(--color-primary)] shrink-0">₹{{ product.selling_price }}</div>
        </a>
        {% endfor %}
    </div>
{% elif query %}
    <div class="text-xs text-gray-500 py-2 border-t border-gray-100 pt-3">No matching products found.</div>
{% endif %}
