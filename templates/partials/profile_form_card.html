<div id="profile-form-card" class="bg-white p-6 sm:p-8 rounded-3xl border border-gray-200 shadow-sm space-y-6">
    {% if success_msg %}
    <!-- Success Alert -->
    <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-2xl flex items-center gap-3 text-xs font-semibold shadow-sm">
        <i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i>
        <span>{{ success_msg }}</span>
    </div>
    {% endif %}

    {% if error_msg %}
    <!-- Error Alert -->
    <div class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-2xl flex items-center gap-3 text-xs font-semibold shadow-sm">
        <i data-lucide="alert-circle" class="w-5 h-5 text-red-600"></i>
        <span>{{ error_msg }}</span>
    </div>
    {% endif %}

    <form 
        hx-post="{% url 'update_profile' %}"
        hx-target="#profile-form-card"
        hx-swap="outerHTML"
        hx-encoding="multipart/form-data"
        class="space-y-6"
        x-data="{ photoPreview: null }">
        {% csrf_token %}
        
        <!-- Avatar / Photo Uploader -->
        <div class="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b border-gray-100">
            <div class="relative">
                <template x-if="photoPreview">
                    <img :src="photoPreview" class="w-24 h-24 rounded-full object-cover shadow-inner border-2 border-white">
                </template>
                <template x-if="!photoPreview">
                    {% if user.profile_picture %}
                    <img src="{{ user.profile_picture.url }}" class="w-24 h-24 rounded-full object-cover shadow-inner border-2 border-white" alt="{{ user.display_name }}">
                    {% else %}
                    <div class="w-24 h-24 rounded-full bg-red-100 text-[var(--color-primary)] flex items-center justify-center font-bold text-2xl font-outfit shadow-inner border-2 border-white">
                        {{ user.display_name|slice:":2"|upper }}
                    </div>
                    {% endif %}
                </template>
                <label for="profile_picture_input" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-[var(--color-primary)] text-white flex items-center justify-center border-2 border-white shadow hover:bg-[var(--color-primary-hover)] transition cursor-pointer" title="Change Profile Picture">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                </label>
                <input type="file" id="profile_picture_input" name="profile_picture" accept="image/*" class="hidden"
                    @change="
                        const file = $event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (e) => { photoPreview = e.target.result; };
                            reader.readAsDataURL(file);
                        }
                    ">
            </div>
            <div class="text-center sm:text-left space-y-1">
                <h3 class="font-bold text-gray-900 text-sm font-outfit">Profile Picture</h3>
                <p class="text-[11px] text-gray-400 max-w-[240px]">JPG, PNG or WEBP format. Click camera icon to upload.</p>
                <div class="flex gap-2 pt-1 justify-center sm:justify-start">
                    <label for="profile_picture_input" class="px-3 py-1.5 bg-gray-50 border hover:bg-gray-100 rounded-lg text-[10px] font-bold text-gray-600 transition cursor-pointer">
                        Upload Image
                    </label>
                </div>
            </div>
        </div>

        <!-- Form Input Fields Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
            
            <!-- First Name -->
            <div class="space-y-1.5">
                <label class="block font-bold text-gray-700">First Name *</label>
                <input type="text" name="first_name" value="{{ user.first_name|default:'' }}" required placeholder="First Name" class="w-full px-4 py-3 bg-[var(--color-background)] border border-gray-200 focus:border-[var(--color-primary)] focus:bg-white rounded-xl font-medium outline-none transition" />
            </div>

            <!-- Last Name -->
            <div class="space-y-1.5">
                <label class="block font-bold text-gray-700">Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name|default:'' }}" placeholder="Last Name" class="w-full px-4 py-3 bg-[var(--color-background)] border border-gray-200 focus:border-[var(--color-primary)] focus:bg-white rounded-xl font-medium outline-none transition" />
            </div>

            <!-- Email Address -->
            <div class="space-y-1.5">
                <label class="block font-bold text-gray-700">Email Address *</label>
                <input type="email" name="email" value="{{ user.email|default:'' }}" required placeholder="email@example.com" class="w-full px-4 py-3 bg-[var(--color-background)] border border-gray-200 focus:border-[var(--color-primary)] focus:bg-white rounded-xl font-medium outline-none transition" />
            </div>

            <!-- Phone Number -->
            <div class="space-y-1.5">
                <label class="block font-bold text-gray-700">Phone / WhatsApp Number</label>
                <input type="tel" name="phone_number" value="{{ user.phone_number|default:'' }}" placeholder="10-digit mobile number" class="w-full px-4 py-3 bg-[var(--color-background)] border border-gray-200 focus:border-[var(--color-primary)] focus:bg-white rounded-xl font-medium outline-none transition" />
            </div>

        </div>

        <!-- Action Buttons -->
        <div class="border-t border-gray-100 pt-6 flex flex-col sm:flex-row justify-end items-center gap-3">
            <a href="{% url 'dashboard' %}" class="w-full sm:w-auto text-center px-6 py-3 rounded-xl border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 font-extrabold text-xs transition">
                Cancel
            </a>
            <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] text-white font-extrabold text-xs rounded-xl shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2">
                <span>Save Profile Details</span>
            </button>
        </div>

    </form>
</div>
